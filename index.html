<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warehouse Management System — KW20</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
  :root{
    --navy:#0f172a;
    --navy-soft:#1e293b;
    --bg:#eef1f6;
    --panel:#ffffff;
    --text:#1f2430;
    --muted:#6b7280;
    --green-bright:#22c55e;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }

  /* ── Topbar ─────────────────────────────── */
  .topbar{
    position:sticky;top:0;z-index:50;
    background:var(--navy);
    display:flex;align-items:center;gap:12px;
    padding:12px 16px;height:60px;
  }
  .menu-btn{
    background:none;border:none;color:#e2e8f0;
    font-size:22px;cursor:pointer;padding:6px;
    display:flex;align-items:center;border-radius:8px;
  }
  .menu-btn:hover{background:var(--navy-soft);}
  .app-icon{
    width:34px;height:34px;border-radius:9px;
    background:var(--green-bright);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:19px;flex-shrink:0;
  }
  .topbar-title{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;}
  .topbar-title h1{
    color:#fff;font-size:15px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25;
  }
  .topbar-title span{color:#94a3b8;font-size:11px;font-weight:500;line-height:1.3;}
  .user-pill{
    display:flex;align-items:center;gap:6px;
    background:var(--navy-soft);border:1px solid #334155;
    color:#cbd5e1;font-size:12.5px;font-weight:600;
    padding:6px 12px;border-radius:999px;flex-shrink:0;
  }
  .user-pill i{font-size:14px;}

  /* ── Drawer ─────────────────────────────── */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:90;}
  .overlay.open{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;left:0;bottom:0;width:272px;max-width:82vw;background:var(--navy);z-index:100;transform:translateX(-100%);transition:transform .28s ease;display:flex;flex-direction:column;}
  .drawer.open{transform:translateX(0);}
  .drawer-head{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid #24324a;}
  .drawer-head span{color:#fff;font-weight:600;font-size:14px;}
  .drawer nav{flex:1;overflow-y:auto;padding:10px 8px;}
  .drawer a{display:flex;align-items:center;gap:11px;color:#cbd5e1;text-decoration:none;font-size:13.5px;font-weight:500;padding:10px 12px;border-radius:10px;margin-bottom:2px;}
  .drawer a i{font-size:17px;color:var(--green-bright);width:22px;text-align:center;}
  .drawer a:hover,.drawer a.active{background:var(--navy-soft);color:#fff;}
  .drawer-foot{padding:12px 16px;border-top:1px solid #24324a;color:#64748b;font-size:11px;}

  /* ── Panel (white rounded container) ────── */
  .wrap{max-width:760px;margin:0 auto;padding:18px 14px 40px;}
  .panel-title{
    font-size:16px;font-weight:600;color:var(--text);
    text-align:center;padding:6px 0 16px;
  }
  .panel{
    background:var(--panel);
    border-radius:22px;
    padding:22px 14px 24px;
    box-shadow:0 4px 20px rgba(17,24,48,.06);
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:26px 10px;
  }
  .app{
    display:flex;flex-direction:column;align-items:center;gap:11px;
    text-decoration:none;color:inherit;
  }
  .tile{
    width:84px;height:84px;border-radius:22px;
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s, box-shadow .15s;
  }
  .tile i{font-size:40px;}
  .app:active .tile{transform:scale(.92);}
  .app:hover .tile{transform:translateY(-3px);box-shadow:0 8px 18px rgba(17,24,48,.14);}
  .app span{
    font-size:13.5px;font-weight:500;color:#374151;
    text-align:center;line-height:1.3;letter-spacing:.005em;
  }

  @media(min-width:560px){
    .grid{grid-template-columns:repeat(4,1fr);gap:32px 12px;}
    .tile{width:92px;height:92px;}
    .tile i{font-size:44px;}
    .app span{font-size:14px;}
  }
</style>
</head>
<body>

<header class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="Open menu"><i class="ti ti-menu-2"></i></button>
  <div class="app-icon"><i class="ti ti-building-warehouse"></i></div>
  <div class="topbar-title">
    <h1>Warehouse Management</h1>
    <span>KW20 Distribution Center</span>
  </div>
  <div class="user-pill"><i class="ti ti-user"></i> KW20</div>
</header>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="app-icon"><i class="ti ti-building-warehouse"></i></div>
    <span>KW20 WMS</span>
  </div>
  <nav id="drawerNav"></nav>
  <div class="drawer-foot">KW20 Distribution Center</div>
</aside>

<div class="wrap">
  <div class="panel-title">Applications</div>
  <div class="panel">
    <div class="grid" id="grid"></div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════
   APP LINKS — edit "url" to match your repos. Relative names
   work if apps live in the same GitHub Pages repo. Otherwise
   use the full URL, e.g.
   "https://kiminging115-source.github.io/kw20goodspreparing/"
   Each app has its own tile color (bg + icon color).
   ════════════════════════════════════════════════════════════ */
const APPS = [
  { name:"Count Code Date",    icon:"ti-calendar-check",           url:"ccd.html",              bg:"#fde0dd", fg:"#e05b45" },
  { name:"Product Management", icon:"ti-cube",                     url:"productmanagement.html",bg:"#d9e8fd", fg:"#2f80ed" },
  { name:"Cycle Count",        icon:"ti-clipboard-list",           url:"cyclecount.html",       bg:"#fceccd", fg:"#e0a212" },
  { name:"Goods Preparation",  icon:"ti-tags",                     url:"goodspreparing.html",   bg:"#fbe1cf", fg:"#f2994a" },
  { name:"Picking New",        icon:"ti-shopping-cart",            url:"pickingnew.html",       bg:"#d9f4e5", fg:"#22a565" },
  { name:"Picking FC",         icon:"ti-snowflake",                url:"pickingfc.html",        bg:"#d5f2f8", fg:"#1aa3bd" },
  { name:"Loading",            icon:"ti-truck-loading",            url:"loading.html",          bg:"#e7ddfb", fg:"#7c5ce0" },
  { name:"Model Monitor",      icon:"ti-device-desktop-analytics", url:"monitor.html",          bg:"#fbdaea", fg:"#d8477f" }
];

document.getElementById('grid').innerHTML = APPS.map(a => `
  <a class="app" href="${a.url}">
    <div class="tile" style="background:${a.bg}"><i class="ti ${a.icon}" style="color:${a.fg}"></i></div>
    <span>${a.name}</span>
  </a>`).join('');

document.getElementById('drawerNav').innerHTML =
  `<a href="index.html" class="active"><i class="ti ti-home"></i> Dashboard</a>` +
  APPS.map(a => `<a href="${a.url}"><i class="ti ${a.icon}"></i> ${a.name}</a>`).join('');

const drawer=document.getElementById('drawer'), overlay=document.getElementById('overlay');
document.getElementById('menuBtn').addEventListener('click',()=>{drawer.classList.add('open');overlay.classList.add('open');});
overlay.addEventListener('click',()=>{drawer.classList.remove('open');overlay.classList.remove('open');});
</script>
</body>
</html>
